name: shatbha
description: شطبها — Atelier ERP for Egyptian finishing SMEs.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.2.0
  dio: ^5.9.0
  drift: ^2.28.0
  drift_flutter: ^0.2.5
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  get_it: ^8.2.0
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  google_fonts: ^6.3.2
  logger: ^2.7.0
  image_picker: ^1.2.0
  file_picker: ^8.3.7
  firebase_core: ^3.15.1
  firebase_messaging: ^15.2.9
  flutter_local_notifications: ^19.3.0
  url_launcher: ^6.3.2
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#1C1814"
  adaptive_icon_foreground: assets/brand/logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/docs/
